[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Bounded claim extraction and catalogue-grounded evaluation agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "langfuse==2.60.4",
  "openai==1.68.2",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
]

[tool.setuptools.packages.find]
include = ["claimlens*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
